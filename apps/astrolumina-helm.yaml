---
# Development release of the astrolumina chart.
# Manual sync: press SYNC in the UI per change (no `automated` block).
# PREREQUISITES before the first SYNC: the Doppler operator, the Traefik CRDs
# (IngressRoute, Middleware -- shipped with RKE2), the ghcr image-pull secret
# created imperatively, and placeholder secrets enabled or replaced
# (`placeholderSecretsEnabled` in values-dev.yaml).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: astrolumina-helm-dev
  namespace: argocd
  labels:
    app.kubernetes.io/name: astrolumina-helm-dev
    app.kubernetes.io/part-of: astrolumina-platform
spec:
  project: default
  source:
    repoURL: https://github.com/AstroLumina-by-Carmen-Ilie/AstroLumina-Helm.git
    targetRevision: HEAD
    path: charts/astrolumina
    helm:
      # values.yaml first, env file second (later files win on conflict).
      valueFiles:
        - values.yaml
        - values-dev.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: astrolumina-dev
  syncPolicy:
    prune: true
    syncOptions:
      - CreateNamespace=true
---
