---
# Production release of the astrolumina chart (TLS + dashboard auth, tags
# pinned in values-production.yaml -- an upgrade is a commit changing a tag).
# Manual sync: press SYNC in the UI per change (no `automated` block).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: astrolumina-helm-production
  namespace: argocd
  labels:
    app.kubernetes.io/name: astrolumina-helm-production
    app.kubernetes.io/part-of: astrolumina-platform
spec:
  project: default
  source:
    repoURL: https://github.com/AstroLumina-by-Carmen-Ilie/AstroLumina-Helm.git
    targetRevision: HEAD
    path: charts/astrolumina
    helm:
      # values.yaml first, env file second (later files win on conflict).
      valueFiles:
        - values.yaml
        - values-production.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: astrolumina-prod
  syncPolicy:
    prune: true
